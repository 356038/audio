<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>WAVE — моя музыка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="./config.js"></script>
<script defer src="./app.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101218;color:#f4f5fa}
body{max-width:560px;margin:auto;padding:28px 20px 60px}h1{letter-spacing:.18em;color:#a2ecdf;margin-bottom:8px}
.card{background:#1c202b;border-radius:20px;padding:20px;margin:20px 0}
button{background:#a2ecdf;color:#101218;border:0;border-radius:12px;padding:12px 16px;font:inherit;cursor:pointer;margin:4px 0}
button.secondary{background:#303747;color:white}button:disabled{opacity:.45;cursor:default}audio,input[type=search]{width:100%;box-sizing:border-box;margin:12px 0}
input[type=search]{padding:14px;border:1px solid #394254;border-radius:12px;background:#1c202b;color:white;font:inherit}
p,small{color:#bec5d5;line-height:1.6}ul{padding:0;list-style:none}.track{display:block;width:100%;text-align:left;background:#1c202b;color:white;padding:16px;margin:8px 0}.track.active{outline:1px solid #a2ecdf}.track small{display:block;margin-top:5px}h2{font-size:20px;overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:220px;overflow:auto}[hidden]{display:none!important}
</style>
</head>
<body>
<h1>WAVE</h1><p>Музыка вашего профиля Telegram</p>
<div><button id="profile">Моя музыка</button> <button id="demo" class="secondary">Тестовые мелодии</button></div>
<p id="library-status" role="status" aria-live="polite">Подключаем библиотеку…</p>
<input id="search" type="search" placeholder="Найти в моей музыке" aria-label="Поиск по загруженной музыке">
<ul id="tracks"></ul>
<button id="more" class="secondary" hidden>Загрузить ещё</button>
<div class="card">
 <small id="performer">Выберите композицию</small><h2 id="title">Ваш плеер</h2>
 <audio id="player" controls preload="metadata" playsinline></audio>
 <div><button id="play" disabled>Слушать</button> <button id="next" class="secondary" disabled>Следующий</button></div>
 <label><input type="checkbox" id="repeat"> Повторять очередь</label>
 <p id="status" role="status" aria-live="polite">Готов к запуску</p>
</div>
<details class="card"><summary>Журнал проверки</summary><p>События плеера не подтверждают слышимость звука. Перезагрузка очищает журнал.</p><button class="secondary" id="save">Скачать журнал</button><pre id="log"></pre></details>
</body>
</html>
